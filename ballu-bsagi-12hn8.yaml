esphome:
  name: ballu-bsagi-12hn8
  friendly_name: Ballu BSAGI-12HN8
  comment: "Ballu iGreen Pro DC BSAGI-12HN8 via Hisense RS-485"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "Ballu BSAGI Fallback"
    password: !secret fallback_password

captive_portal:

external_components:
  - source:
      type: local
      path: AC-Hisense/components
    components: [ac_hi]

uart:
  id: ac_uart
  # Historical tested BSAGI-12HN8 configuration and legacy/ballu_legacy.yaml:
  # ESP TX GPIO16 -> transmitter input; ESP RX GPIO17 <- receiver output.
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

climate:
  - platform: ac_hi
    name: "Кондиционер"
    id: ballu_ac
    uart_id: ac_uart
    update_interval: 2s
    enable_presets: true
