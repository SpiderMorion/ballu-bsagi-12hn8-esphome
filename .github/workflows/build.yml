name: ESPHome build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned ESPHome
        run: python -m pip install --requirement requirements.txt

      - name: Audit source tree
        run: python scripts/verify_repository.py

      - name: Create disposable CI credentials
        run: python scripts/create_ci_secrets.py

      - name: Validate ESPHome configuration
        run: esphome config ballu-bsagi-12hn8.yaml

      - name: Compile firmware
        run: esphome compile ballu-bsagi-12hn8.yaml

      - name: Remove disposable credentials
        if: always()
        run: rm -f secrets.yaml

      # Deliberately no artifact upload: firmware embeds build-time credentials.
